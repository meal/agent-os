name: Compose checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [fmt, clippy, host, fake]
    env:
      COMPOSE_PROJECT_NAME: agentos-${{ github.run_id }}-${{ matrix.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, checked 2026-10-04
      - run: docker compose build test
      - run: sh scripts/test-check.sh
      - run: sh scripts/test-acceptance.sh
      - run: sh scripts/build-guest-image.sh --self-test
      - run: docker compose run --rm test sh scripts/test-python-runtime.sh
      - run: sh scripts/check.sh "${{ matrix.check }}"
