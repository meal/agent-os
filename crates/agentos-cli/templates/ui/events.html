<section class="event-page" data-after="{{ page.last_seq }}" data-more="{{ page.has_more }}"><h2>Journal events</h2><table><thead><tr><th>Sequence</th><th>Event</th><th>Time</th></tr></thead><tbody>{% for event in page.rows %}<tr data-seq="{{ event.seq }}"><td>{{ event.seq }}</td><td>{{ event.event_type }}{% if event.truncated %} · payload exceeds preview limit{% endif %}</td><td><time data-ts="{{ event.ts }}">{{ event.ts }}</time></td></tr>{% endfor %}</tbody></table>{% if page.rows.is_empty() %}<p class="muted">No later events.</p>{% endif %}</section>
